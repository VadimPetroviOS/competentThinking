<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Решение задач с конца</title>
<style>
  :root{
    --void: #0A0A1C;
    --void-2: #150F30;
    --nebula: #3A2166;
    --bg: #0A0A1C;
    --panel: rgba(20, 16, 42, 0.6);
    --panel-solid: #171233;
    --panel-line: rgba(255,255,255,.12);
    --floor: #DCD6EC;
    --floor-edge: #A79FC9;
    --fragile: #F0A93E;
    --fragile-edge: #B87A1F;
    --tile-void: #14102b;
    --goal-ring: #2dd4bf;
    --goal-glow: rgba(45,212,191,.35);
    --block: #ff6a4d;
    --block-edge: #c8461f;
    --block-shine: #ffb199;
    --text: #F3F1FF;
    --muted: #A79FC9;
    --accent: #FFB454;
    --accent-ink: #3D2400;
    --danger: #ff5d5d;
    --good: #6FDFA6;
    --board-accent: #2dd4bf;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  #stars{
    position:fixed;
    inset:0;
    z-index:0;
    display:block;
  }
  .nebula{
    position:fixed;
    inset:-10%;
    z-index:0;
    pointer-events:none;
    background:
      radial-gradient(38% 30% at 18% 22%, rgba(122,90,220,.35), transparent 60%),
      radial-gradient(45% 35% at 82% 78%, rgba(255,140,90,.14), transparent 60%),
      radial-gradient(30% 25% at 75% 15%, rgba(90,170,220,.20), transparent 60%),
      linear-gradient(180deg, var(--void) 0%, var(--void-2) 55%, var(--void) 100%);
    filter: blur(2px);
  }
  .panel{
    width:100%;
    max-width:720px;
    background:var(--panel);
    border:1px solid var(--panel-line);
    border-radius:22px;
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    box-shadow: 0 1px 0 rgba(255,255,255,.06) inset, 0 30px 60px -25px rgba(0,0,0,.7);
    padding:26px 22px 24px;
  }
  body{
    background:var(--void);
    color:var(--text);
    font-family:-apple-system,'Segoe UI',system-ui,sans-serif;
    min-height:100vh;
    touch-action:manipulation;
    -webkit-text-size-adjust:100%;
  }
  .stage{
    position:relative;
    z-index:1;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:28px 16px 60px;
  }
  .title{
    font-family:-apple-system,'Segoe UI',system-ui,sans-serif;
    font-weight:700;
    font-size:clamp(28px,5vw,42px);
    letter-spacing:.06em;
    text-transform:uppercase;
    margin:0 0 2px;
    display:flex;
    align-items:baseline;
    gap:10px;
  }
  .title span{
    font-size:.4em;
    font-weight:500;
    letter-spacing:.14em;
    color:var(--accent);
    text-transform:uppercase;
  }
  .title-row{
    position:relative;
    display:flex;
    align-items:center;
    gap:10px;
    margin:0 0 18px;
  }
  .title-row .title{ margin:0; }
  .info-btn{
    width:24px;
    height:24px;
    min-width:24px;
    border-radius:50%;
    border:1px solid var(--panel-line);
    background:var(--panel);
    color:var(--muted);
    font-family:-apple-system,'Segoe UI',system-ui,sans-serif;
    font-style:italic;
    font-weight:700;
    font-size:13px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:.15s;
    padding:0;
  }
  .info-btn:hover, .info-btn.active{
    border-color:var(--accent);
    color:var(--accent);
  }
  .info-popover{
    display:none;
    position:absolute;
    top:calc(100% + 10px);
    left:0;
    z-index:30;
    width:290px;
    background:var(--panel);
    border:1px solid var(--panel-line);
    border-radius:12px;
    padding:16px 18px;
    box-shadow:0 20px 40px -12px rgba(0,0,0,.55);
    text-align:left;
  }
  .info-popover.show{ display:block; }
  .info-popover h4{
    margin:0 0 10px;
    font-family:-apple-system,'Segoe UI',system-ui,sans-serif;
    font-size:13.5px;
    letter-spacing:.03em;
    color:var(--accent);
    text-transform:uppercase;
  }
  .info-popover ol{
    margin:0;
    padding-left:18px;
    color:var(--text);
    font-size:13px;
    line-height:1.55;
  }
  .info-popover li{ margin-bottom:6px; }
  .info-popover li:last-child{ margin-bottom:0; }
  .subtitle{
    color:var(--muted);
    font-size:13.5px;
    margin:0 0 18px;
    letter-spacing:.02em;
  }

  .hud{
    display:flex;
    gap:10px;
    align-items:center;
    flex-wrap:wrap;
    justify-content:center;
    margin-bottom:10px;
  }
  .pill{
    background:var(--panel);
    border:1px solid var(--panel-line);
    border-radius:999px;
    padding:7px 16px;
    font-size:13px;
    color:var(--muted);
    display:flex;
    gap:8px;
    align-items:center;
  }
  .pill b{color:var(--text);font-weight:600;}
  .levels{
    display:flex;
    gap:6px;
    flex-wrap:wrap;
    justify-content:center;
    max-width:720px;
    margin-bottom:14px;
  }
  .lvl-btn, .icon-btn{
    background:var(--panel);
    border:1px solid var(--panel-line);
    color:var(--muted);
    border-radius:999px;
    padding:6px 12px;
    font-size:12.5px;
    font-weight:500;
    cursor:pointer;
    transition:.15s;
    font-family:inherit;
    min-width:30px;
  }
  .lvl-btn:hover, .icon-btn:hover{border-color:var(--accent);color:var(--text);}
  .lvl-btn.active{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600;}
  .lvl-btn.locked{opacity:.35;cursor:not-allowed;}
  .lvl-btn.locked:hover{border-color:var(--panel-line);color:var(--muted);}

  .board-wrap{
    position:relative;
    background:rgba(0,0,0,.25);
    border:1px solid var(--panel-line);
    border-radius:18px;
    padding:18px;
    box-shadow:0 30px 60px -20px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.03);
    margin:0 auto;
    overflow:auto;
  }
  .board{
    position:relative;
    background:var(--tile-void);
    border-radius:10px;
    overflow:hidden;
    margin:0 auto;
  }
  .cell{
    position:absolute;
    border-radius:5px;
  }
  .cell.floor{
    background:linear-gradient(160deg,var(--floor),var(--floor-edge));
    box-shadow: inset 0 0 0 1px rgba(0,0,0,.06);
  }
  .cell.fragile{
    background:
      repeating-linear-gradient(115deg, rgba(0,0,0,.09) 0 2px, transparent 2px 10px),
      linear-gradient(160deg,var(--fragile),var(--fragile-edge));
    box-shadow: inset 0 0 0 1px rgba(0,0,0,.12);
    animation: crack-pulse 2.6s ease-in-out infinite;
  }
  @keyframes crack-pulse{
    0%,100%{filter:brightness(1);}
    50%{filter:brightness(1.06);}
  }
  .cell.goal{
    background:var(--tile-void);
  }
  .cell.goal::after{
    content:"";
    position:absolute;
    inset:14%;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #1a2b2a, #050707 70%);
    box-shadow:0 0 0 3px var(--goal-glow), 0 0 22px 4px var(--goal-glow), inset 0 3px 6px rgba(0,0,0,.7);
  }

  .cell.switch-soft{
    background:linear-gradient(160deg,var(--floor),var(--floor-edge));
    box-shadow: inset 0 0 0 1px rgba(0,0,0,.06);
  }
  .cell.switch-soft::after{
    content:"";
    position:absolute;
    inset:32%;
    border-radius:50%;
    background:var(--board-accent);
    box-shadow:0 0 0 3px rgba(45,212,191,.28), inset 0 2px 3px rgba(0,0,0,.3);
  }
  .cell.switch-hard{
    background:linear-gradient(160deg,var(--floor),var(--floor-edge));
    box-shadow: inset 0 0 0 1px rgba(0,0,0,.06);
  }
  .cell.switch-hard::before, .cell.switch-hard::after{
    content:"";
    position:absolute;
    top:50%;
    left:50%;
    width:62%;
    height:4px;
    border-radius:2px;
    background:var(--danger);
  }
  .cell.switch-hard::before{ transform:translate(-50%,-50%) rotate(45deg); }
  .cell.switch-hard::after{ transform:translate(-50%,-50%) rotate(-45deg); }

  .cell.split-tile{
    background:linear-gradient(160deg,var(--floor),var(--floor-edge));
    box-shadow: inset 0 0 0 1px rgba(0,0,0,.06);
  }
  .cell.split-tile::before, .cell.split-tile::after{
    content:"";
    position:absolute;
    top:32%;
    width:30%;
    height:36%;
    border-radius:50%;
    border:3px solid var(--block);
  }
  .cell.split-tile::before{ left:16%; }
  .cell.split-tile::after{ right:16%; }

  .cell.bridge-closed{
    background:
      repeating-linear-gradient(45deg, rgba(255,255,255,.04) 0 6px, transparent 6px 12px),
      var(--tile-void);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.07);
    opacity:.5;
    transition: background .25s, opacity .25s;
  }
  .cell.bridge-open{
    background:
      repeating-linear-gradient(90deg, rgba(0,0,0,.08) 0 3px, transparent 3px 22px),
      linear-gradient(160deg,var(--floor),var(--floor-edge));
    box-shadow: inset 0 0 0 1px rgba(0,0,0,.08);
    opacity:1;
    transition: background .25s, opacity .25s;
  }

  .block{
    position:absolute;
    border-radius:10px;
    background:linear-gradient(155deg, var(--block-shine) 0%, var(--block) 45%, var(--block-edge) 100%);
    box-shadow:
      0 8px 16px -4px rgba(0,0,0,.55),
      inset 0 0 0 1px rgba(0,0,0,.15),
      inset 0 2px 4px rgba(255,255,255,.25);
    transition: top .13s ease, left .13s ease, width .13s ease, height .13s ease, transform .13s ease, opacity .2s ease;
    z-index:5;
  }
  .block::before{
    content:"";
    position:absolute;
    inset:0;
    border-radius:10px;
    background:repeating-linear-gradient(90deg, transparent 0 6px, rgba(0,0,0,.05) 6px 7px);
    opacity:.5;
  }
  .block.standing::after{
    content:"";
    position:absolute;
    inset:18%;
    border-radius:6px;
    background:rgba(255,255,255,.18);
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.1);
  }
  .block.falling{
    transform: scale(0.15) rotate(25deg);
    opacity:0;
  }
  .block.active-cube{
    box-shadow:
      0 8px 16px -4px rgba(0,0,0,.55),
      0 0 0 3px var(--board-accent),
      0 0 16px 2px rgba(45,212,191,.5),
      inset 0 2px 4px rgba(255,255,255,.25);
  }
  .block.inactive-cube{
    filter:brightness(.72);
  }

  .status-overlay{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(10,12,17,0);
    pointer-events:none;
    transition:background .2s;
    z-index:20;
  }
  .status-overlay.show{
    background:rgba(10,12,17,.55);
    pointer-events:auto;
  }
  .status-card{
    background:var(--panel);
    border:1px solid var(--panel-line);
    border-radius:14px;
    padding:22px 28px;
    text-align:center;
    transform:translateY(8px) scale(.96);
    opacity:0;
    transition:.25s;
  }
  .status-overlay.show .status-card{transform:translateY(0) scale(1);opacity:1;}
  .status-card h3{
    margin:0 0 6px;
    font-family:-apple-system,'Segoe UI',system-ui,sans-serif;
    letter-spacing:.03em;
  }
  .status-card p{margin:0 0 16px;color:var(--muted);font-size:13.5px;}
  .status-card.win h3{color:var(--accent);}
  .status-card.lose h3{color:var(--danger);}
  .status-card.congrats{
    border-color: var(--accent);
    box-shadow: 0 0 0 1px var(--accent), 0 0 40px 4px rgba(255,180,84,.35);
  }
  .status-card.congrats h3{
    font-size: 22px;
  }
  .status-card button{
    background:var(--accent);
    border:none;
    color:var(--accent-ink);
    font-weight:600;
    padding:9px 20px;
    border-radius:999px;
    cursor:pointer;
    font-family:inherit;
    font-size:13.5px;
  }

  .controls{
    margin-top:20px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
  }
  .dpad-overlay{
    position:absolute;
    bottom:6px;
    right:40px;
    z-index:12;
    opacity:.55;
    transition:opacity .2s;
  }
  .dpad-overlay:hover{ opacity:1; }
  .dpad{
    display:grid;
    grid-template-columns:repeat(3,34px);
    grid-template-rows:repeat(3,34px);
    gap:4px;
  }
  .dpad button{
    background:rgba(20,16,42,.7);
    backdrop-filter:blur(6px);
    border:1px solid var(--panel-line);
    color:var(--text);
    border-radius:8px;
    font-size:14px;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:.15s;
  }
  .dpad button:hover{border-color:var(--accent);color:var(--accent);}
  .dpad button:active{transform:scale(.92);}
  .space-btn{
    margin-top:6px;
    background:var(--panel);
    border:1px solid var(--panel-line);
    color:var(--text);
    border-radius:9px;
    padding:8px 18px;
    font-size:13px;
    cursor:pointer;
    font-family:inherit;
  }
  .space-btn:hover{border-color:var(--accent);color:var(--accent);}
  .space-btn.hidden{display:none;}
  .hint{color:var(--muted);font-size:12px;letter-spacing:.02em;text-align:center;max-width:420px;}
</style>
</head>
<body>
<canvas id="stars"></canvas>
<div class="nebula"></div>
<div class="stage">
<div class="panel">

  <div class="title-row">
    <h1 class="title">Решение задач с конца</h1>
    <button class="info-btn" id="infoBtn" aria-label="Как играть">i</button>
    <div class="info-popover" id="infoPopover">
      <h4>Как играть</h4>
      <ol>
        <li>Составить план — последовательность шагов, начиная с конца (от финиша к старту).</li>
        <li>Проверить план мысленно, не приступая к действиям.</li>
        <li>Реализовать план.</li>
      </ol>
    </div>
  </div>

  <div class="hud">
    <div class="pill">Ходы <b id="moveCount">0</b></div>
  </div>

  <div class="levels" id="levels"></div>

  <div class="board-wrap" id="boardWrap">
    <div class="board" id="board">
      <div class="status-overlay" id="overlay">
        <div class="status-card" id="statusCard">
          <h3 id="statusTitle"></h3>
          <p id="statusText"></p>
          <button id="statusBtn"></button>
        </div>
      </div>
    </div>
    <div class="dpad-overlay" id="dpadOverlay">
      <div class="dpad">
        <div></div>
        <button data-dir="up">↑</button>
        <div></div>
        <button data-dir="left">←</button>
        <button data-dir="down">↓</button>
        <button data-dir="right">→</button>
      </div>
    </div>
  </div>

  <div class="controls">
    <button class="space-btn hidden" id="spaceBtn">⎵ Переключить кубик (Space)</button>
  </div>

</div>
</div>

<script>
(function(){
  "use strict";
  var canvas = document.getElementById('stars');
  var ctx = canvas.getContext('2d');
  var stars = [];
  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function resize(){
    canvas.width = window.innerWidth * devicePixelRatio;
    canvas.height = window.innerHeight * devicePixelRatio;
    canvas.style.width = window.innerWidth + 'px';
    canvas.style.height = window.innerHeight + 'px';
    ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
    var count = Math.round((window.innerWidth * window.innerHeight) / 3800);
    stars = [];
    for(var i=0;i<count;i++){
      stars.push({
        x: Math.random()*window.innerWidth,
        y: Math.random()*window.innerHeight,
        r: Math.random()*1.3+0.3,
        phase: Math.random()*Math.PI*2,
        speed: 0.4+Math.random()*0.8
      });
    }
  }
  window.addEventListener('resize', resize);
  resize();
  function drawStars(t){
    ctx.clearRect(0,0,window.innerWidth,window.innerHeight);
    for(var i=0;i<stars.length;i++){
      var s = stars[i];
      var tw = reduceMotion ? 0.85 : 0.55+0.45*Math.sin(t*0.001*s.speed+s.phase);
      ctx.beginPath();
      ctx.fillStyle = 'rgba(243,241,255,'+(tw*0.9).toFixed(3)+')';
      ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
      ctx.fill();
    }
  }
  var startT = null;
  function loop(t){
    if(startT===null) startT = t;
    drawStars(t-startT);
    if(!reduceMotion) requestAnimationFrame(loop);
  }
  if(reduceMotion){ drawStars(0); } else { requestAnimationFrame(loop); }
})();
</script>

gICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAf3+AgICAgICAgICAgICAgICAgICAgICAgIB/f3+AgICAgICAgICAgICAgH+AgIB/f3+Af39/gICAf3+AgICAgH9/f39/f4CAf3+AgH9/f39/f39/f39/f39/f39/f3+Af39/f39/f39/f39/f39/f39/f39/f39/f39/f39/f39/f39/f39/f39/f39/f39/f39/f39/f39/f39/f39/f39/f39/f4CAf39/f39/f39/f39/f4B/f39/f39/f39/f39/f39/gIB/f39/f39/f39/f3+Af39/f39/f39/f3+AgICAgH9/f4CAf39/f39/f4CAgICAgICAgICAgICAgICAgICAgICAgIB/f4CAgICAgH+AgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgIB/f4CAgICAgICAgICAgICAgICAgICAgICAgICAgICAf39/gICAgICAgICAgICAgICAgIB/f39/gH+AgICAgICAgIB/gIB/gICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICA"};

const VOID=0, FLOOR=1, FRAGILE=2, GOAL=3, SWITCH_SOFT=4, SWITCH_HARD=5, BRIDGE=6, SPLIT=8;

function parseRawLevel(raw){
  const grid = raw.grid.map(row => row.split('').map(Number));
  const rowsN = grid.length, cols = grid[0].length;
  const bridgeInit = {};
  (raw.bridges||[]).forEach(b => { bridgeInit[b.y+'_'+b.x] = b.on; });
  const switches = (raw.switches||[]).map(s => ({
    r:s.y, c:s.x, type:s.type,
    targets:(s.targets||[]).map(t => ({r:t.y, c:t.x, mode:t.mode})),
  }));
  const splits = (raw.splits||[]).map(s => ({
    r:s.y, c:s.x,
    d1:{r:s.d1[1], c:s.d1[0]},
    d2:{r:s.d2[1], c:s.d2[0]},
  }));
  const goal = raw.goal ? {r:raw.goal[1], c:raw.goal[0]} : null;

  // Обрезаем поле по фактическим границам плиток (данные хранятся в
  // фиксированной сетке 15x10, но у большинства уровней содержимое
  // занимает только часть — не рендерим лишнюю пустую область).
  let minR=rowsN, maxR=-1, minC=cols, maxC=-1;
  for(let r=0;r<rowsN;r++){
    for(let c=0;c<cols;c++){
      if(grid[r][c] !== 0){
        if(r<minR) minR=r; if(r>maxR) maxR=r;
        if(c<minC) minC=c; if(c>maxC) maxC=c;
      }
    }
  }
  const pad = 1;
  const offR = Math.max(0, minR-pad);
  const offC = Math.max(0, minC-pad);
  const viewRows = Math.min(rowsN, maxR+pad+1) - offR;
  const viewCols = Math.min(cols, maxC+pad+1) - offC;

  return {
    name: raw.name, grid, bridgeInit, switches, splits, goal,
    start:{r:raw.spawn[1], c:raw.spawn[0]},
    rowsN, cols, offR, offC, viewRows, viewCols,
  };
}

const LEVELS = RAW_LEVELS.map(parseRawLevel);

let CELL = 40;
const GAP = 3;
const BOARD_WRAP_PAD = 19; // 18px padding + 1px border, одинаково со всех сторон

function computeCellSize(lvl){
  if(!lvl) return 40;
  const stageAndPanelMargin = 32 + 44 + 12; // отступы .stage + .panel + небольшой запас
  const availW = Math.max(160, window.innerWidth - stageAndPanelMargin);
  const availH = Math.max(160, window.innerHeight * 0.5);
  const byWidth = Math.floor((availW - BOARD_WRAP_PAD*2) / lvl.viewCols);
  const byHeight = Math.floor((availH - BOARD_WRAP_PAD*2) / lvl.viewRows);
  return Math.max(20, Math.min(40, byWidth, byHeight));
}

  levelIdx: 0,
  grid: null,
  block: null,
  split: null, // {a:{r,c}, b:{r,c}, active:0|1} or null
  moves: 0,
  locked: false,
  bridges: {},
};

// Звуки — извлечены из оригинальной игры (см. jacobcoughenour/bloxorz_gba).
// Для каждого ключа создаём пул из пары <audio>, чтобы быстрые повторные
// срабатывания (например, серия ходов) не обрывали друг друга.
const SOUND_POOL = {};
function getAudioSlot(key){
  if(!SOUND_DATA[key]) return null;
  if(!SOUND_POOL[key]){
    SOUND_POOL[key] = [0,1].map(()=>{
      const a = new Audio(SOUND_DATA[key]);
      a.preload = 'auto';
      return a;
    });
    SOUND_POOL[key]._next = 0;
  }
  const pool = SOUND_POOL[key];
  const a = pool[pool._next];
  pool._next = (pool._next + 1) % pool.length;
  return a;
}
let soundsEnabled = true;
function playSound(key, volume){
  if(!soundsEnabled) return;
  const a = getAudioSlot(key);
  if(!a) return;
  try{
    a.currentTime = 0;
    a.volume = volume===undefined ? 0.5 : volume;
    a.play().catch(()=>{});
  }catch(e){}
}
function playRandomMove(){
  const n = 1 + Math.floor(Math.random()*6);
  playSound('move'+n, 0.35);
}

const boardEl = document.getElementById('board');
const boardWrapEl = document.getElementById('boardWrap');
const overlayEl = document.getElementById('overlay');
const statusCard = document.getElementById('statusCard');

const statusText = document.getElementById('statusText');

function buildLevelButtons(){
  levelsEl.innerHTML = '';
  LEVELS.forEach((lvl,i)=>{
    const unlocked = i <= unlockedUpTo;
    const b = document.createElement('button');
    b.className = 'lvl-btn' + (i===state.levelIdx ? ' active' : '') + (unlocked ? '' : ' locked');
    b.textContent = unlocked ? String(i+1) : '🔒';
    b.title = unlocked
      ? 'Уровень ' + (i+1)
      : 'Уровень ' + (i+1) + ' ещё не открыт — пройди предыдущий';
    b.disabled = !unlocked;
    if(unlocked) b.addEventListener('click', ()=> { playSound('click', 0.4); loadLevel(i); });
    levelsEl.appendChild(b);
  });
}

function startLevel(lvl, idx){
  if(idx >= 0 && idx > unlockedUpTo) return; // safety guard against loading a locked level
  if(autoAdvanceTimer){ clearTimeout(autoAdvanceTimer); autoAdvanceTimer = null; }
  state.levelIdx = idx;
  currentLevel = lvl;
  state.grid = lvl.grid.map(row=>row.slice());
  state.bridges = Object.assign({}, lvl.bridgeInit);
  state.split = null;
  state.block = {r1:lvl.start.r, c1:lvl.start.c, r2:lvl.start.r, c2:lvl.start.c};
  state.moves = 0;
  state.locked = false;
  moveCountEl.textContent = '0';
  overlayEl.classList.remove('show');
  buildLevelButtons();
  spaceBtn.classList.add('hidden');
  render(true);
}

function loadLevel(idx){
  startLevel(LEVELS[idx], idx);
}

function markFloorCells(grid, b){
  const r1=Math.min(b.r1,b.r2), r2=Math.max(b.r1,b.r2);
  const c1=Math.min(b.c1,b.c2), c2=Math.max(b.c1,b.c2);
  for(let r=r1;r<=r2;r++) for(let c=c1;c<=c2;c++) grid[r][c]=FLOOR;
}

function inGridBounds(rows, cols, b){
  const r1=Math.min(b.r1,b.r2), r2=Math.max(b.r1,b.r2);
  const c1=Math.min(b.c1,b.c2), c2=Math.max(b.c1,b.c2);
  return r1>=0 && r2<rows && c1>=0 && c2<cols;
}

// Генератор случайного уровня (портирован из anhddo/bloxorz, Wood.mapGenerator):
// блок случайно катится по своей настоящей физике заданное число шагов,
// каждая клетка на пути становится полом, в конце блок "дожимается" до
// вертикального положения — туда ставится финиш.
function randomLevelWalk(rows, cols, steps){
  const grid = Array.from({length:rows}, ()=>Array(cols).fill(VOID));
  const startR = Math.floor(rows/2), startC = Math.floor(cols/2);
  let block = {r1:startR, c1:startC, r2:startR, c2:startC};
  markFloorCells(grid, block);
  const dirs = ['up','down','left','right'];
  let count = 0, attempts = 0;
  while(count < steps && attempts < 500){
    attempts++;
    const dir = dirs[Math.floor(Math.random()*4)];
    const nb = rollBlock(block, dir);
    if(!inGridBounds(rows, cols, nb)) continue;
    block = nb;
    markFloorCells(grid, block);
    count++;
  }
  let tries = 0;
  while(!(block.r1===block.r2 && block.c1===block.c2) && tries < 5){
    tries++;
    const lyingHoriz = (block.r1===block.r2);
    const finishDirs = lyingHoriz ? ['right','left'] : ['down','up'];
    for(const d of finishDirs){
      const nb = rollBlock(block, d);
      if(inGridBounds(rows, cols, nb)){ block = nb; markFloorCells(grid, block); break; }
    }
  }
  const goalR = block.r1, goalC = block.c1;
  grid[goalR][goalC] = GOAL;
  [[goalR-1,goalC],[goalR+1,goalC],[goalR,goalC-1],[goalR,goalC+1]].forEach(([r,c])=>{
    if(r>=0 && r<rows && c>=0 && c<cols && grid[r][c]===VOID) grid[r][c]=FLOOR;
  });
  return {
    name:'random', grid, bridgeInit:{}, switches:[], splits:[], goal:{r:goalR,c:goalC},
    start:{r:startR,c:startC}, cols, rowsN: rows,
    offR:0, offC:0, viewRows: rows, viewCols: cols,
  };
}

function generateRandomLevel(){
  const lvl = randomLevelWalk(8, 12, 18);
  startLevel(lvl, -1);
}

function render(fullRebuild){
  const lvl = currentLevel;
  CELL = computeCellSize(lvl);
  const width = lvl.viewCols*CELL;
  const height = lvl.viewRows*CELL;
  boardEl.style.width = width+'px';
  boardEl.style.height = height+'px';
  boardWrapEl.style.width = (width + BOARD_WRAP_PAD*2) + 'px';
  boardWrapEl.style.height = (height + BOARD_WRAP_PAD*2) + 'px';

  if(fullRebuild){
    Array.from(boardEl.querySelectorAll('.cell, .block')).forEach(n=>n.remove());
    bridgeEls = {};
    for(let r=0;r<lvl.rowsN;r++){
      for(let c=0;c<lvl.cols;c++){
        const t = state.grid[r][c];
        if(t===VOID) continue;
        let cls;
        if(t===FLOOR) cls='floor';
        else if(t===FRAGILE) cls='fragile';
        else if(t===GOAL) cls='goal';
        else if(t===SWITCH_SOFT) cls='switch-soft';
        else if(t===SWITCH_HARD) cls='switch-hard';
        else if(t===SPLIT) cls='split-tile';
        else if(t===BRIDGE) cls = state.bridges[r+'_'+c] ? 'bridge-open' : 'bridge-closed';
        const d = document.createElement('div');
        d.className = 'cell ' + cls;
        d.style.left = ((c-lvl.offC)*CELL+GAP/2)+'px';
        d.style.top = ((r-lvl.offR)*CELL+GAP/2)+'px';
        d.style.width = (CELL-GAP)+'px';
        d.style.height = (CELL-GAP)+'px';
        if(t===BRIDGE){
          const key = r+'_'+c;
          if(!bridgeEls[key]) bridgeEls[key] = [];
          bridgeEls[key].push(d);
        }
        boardEl.appendChild(d);
      }
    }
    const blockEl = document.createElement('div');
    blockEl.className = 'block';
    blockEl.id = 'blockEl';
    boardEl.appendChild(blockEl);
    const block2El = document.createElement('div');
    block2El.className = 'block';
    block2El.id = 'block2El';
    block2El.style.display = 'none';
    boardEl.appendChild(block2El);
  }

  const blockEl = document.getElementById('blockEl');
  const block2El = document.getElementById('block2El');

  if(state.split){
    const cellStyle = (el, r, c, active)=>{
      el.style.display = 'block';
      el.style.left = ((c-lvl.offC)*CELL+GAP/2+1)+'px';
      el.style.top = ((r-lvl.offR)*CELL+GAP/2+1)+'px';
      el.style.width = (CELL-GAP-2)+'px';
      el.style.height = (CELL-GAP-2)+'px';
      el.classList.add('standing');
      el.classList.remove('falling');
      el.classList.toggle('active-cube', active);
      el.classList.toggle('inactive-cube', !active);
    };
    cellStyle(blockEl, state.split.a.r, state.split.a.c, state.split.active===0);
    cellStyle(block2El, state.split.b.r, state.split.b.c, state.split.active===1);
  } else {
    block2El.style.display = 'none';
    blockEl.classList.remove('inactive-cube','active-cube');
    const b = state.block;
    const r1 = Math.min(b.r1,b.r2), r2=Math.max(b.r1,b.r2);
    const c1 = Math.min(b.c1,b.c2), c2=Math.max(b.c1,b.c2);
    blockEl.style.left = ((c1-lvl.offC)*CELL+GAP/2+1)+'px';
    blockEl.style.top = ((r1-lvl.offR)*CELL+GAP/2+1)+'px';
    blockEl.style.width = ((c2-c1+1)*CELL-GAP-2)+'px';
    blockEl.style.height = ((r2-r1+1)*CELL-GAP-2)+'px';
    blockEl.classList.toggle('standing', r1===r2 && c1===c2);
    blockEl.classList.remove('falling');
  }
}

function inBounds(lvl, r,c){
  return r>=0 && r<lvl.rowsN && c>=0 && c<lvl.cols;
}

function isBlocked(lvl, r, c){
  if(!inBounds(lvl,r,c)) return true;
  const t = state.grid[r][c];
  if(t===VOID) return true;
  if(t===BRIDGE) return !state.bridges[r+'_'+c];
  return false;
}

function refreshBridges(){
  for(const key in bridgeEls){
    const open = !!state.bridges[key];
    bridgeEls[key].forEach(el=>{
      el.classList.toggle('bridge-open', open);
      el.classList.toggle('bridge-closed', !open);
    });
  }
}

function rollBlock(b, dir){
  let {r1,c1,r2,c2} = b;
  const standing = (r1===r2 && c1===c2);
  if(dir==='left' || dir==='right'){
    const lyingHoriz = (r1===r2 && c1!==c2);
    if(standing){
      const c = c1;
      const nc = dir==='right' ? c+1 : c-2;
      return {r1:r1, c1:nc, r2:r1, c2:nc+1};
    } else if(lyingHoriz){
      const cmin = Math.min(c1,c2), cmax = Math.max(c1,c2);
      const nc = dir==='right' ? cmax+1 : cmin-1;
      return {r1:r1, c1:nc, r2:r1, c2:nc};
    } else {
      const nc = dir==='right' ? c1+1 : c1-1;
      return {r1:r1, c1:nc, r2:r2, c2:nc};
    }
  } else {
    const lyingVert = (c1===c2 && r1!==r2);
    if(standing){
      const r = r1;
      const nr = dir==='down' ? r+1 : r-2;
      return {r1:nr, c1:c1, r2:nr+1, c2:c1};
    } else if(lyingVert){
      const rmin = Math.min(r1,r2), rmax = Math.max(r1,r2);
      const nr = dir==='down' ? rmax+1 : rmin-1;
      return {r1:nr, c1:c1, r2:nr, c2:c1};
    } else {
      const nr = dir==='down' ? r1+1 : r1-1;
      return {r1:nr, c1:c1, r2:nr, c2:c2};
    }
  }
}

function getCells(b){
  const r1=Math.min(b.r1,b.r2), r2=Math.max(b.r1,b.r2);
  const c1=Math.min(b.c1,b.c2), c2=Math.max(b.c1,b.c2);
  const cells=[];
  for(let r=r1;r<=r2;r++) for(let c=c1;c<=c2;c++) cells.push([r,c]);
  return cells;
}

// Мягкие переключатели срабатывают от касания в любом положении блока
// (стоя или лёжа, и даже от отдельного кубика после разделения).
// Жёсткие переключатели требуют, чтобы весь (неразделённый) блок стоял
// на них вертикально — по правилам из настоящей игровой логики.
function triggerSwitches(lvl, cells, allowHard){
  lvl.switches.forEach(sw=>{
    const touched = cells.some(([r,c]) => r===sw.r && c===sw.c);
    if(!touched) return;
    const activates = sw.type==='hard' ? (allowHard && cells.length===1) : true;
    if(!activates) return;
    playSound('hover', 0.4);
    sw.targets.forEach(t=>{
      const key = t.r+'_'+t.c;
      let nowOpen;
      if(t.mode==='onoff'){ state.bridges[key] = !state.bridges[key]; nowOpen = state.bridges[key]; }
      else if(t.mode==='on'){ state.bridges[key] = true; nowOpen = true; }
      else if(t.mode==='off'){ state.bridges[key] = false; nowOpen = false; }
      playSound(nowOpen ? 'bridgeOn' : 'bridgeOff', 0.4);
    });
  });
}

function evaluateBlock(lvl, block){
  const cells = getCells(block);
  triggerSwitches(lvl, cells, true);

  if(cells.length===1){
    const [r,c] = cells[0];
    if(state.grid[r][c]===SPLIT){
      const sp = lvl.splits.find(s=>s.r===r && s.c===c);
      if(sp){
        state.split = { a:{r:sp.d1.r,c:sp.d1.c}, b:{r:sp.d2.r,c:sp.d2.c}, active:0 };
        playSound('split', 0.5);
        return {status:'split'};
      }
    }
  }

  for(const [r,c] of cells){
    if(isBlocked(lvl,r,c)) return {status:'lost'};
  }

  if(cells.length===1){
    const [r,c] = cells[0];
    const t = state.grid[r][c];
    if(t===GOAL) return {status:'won'};
    if(t===FRAGILE){
      state.grid[r][c]=VOID;
      return {status:'lost'};
    }
  }
  return {status:'playing'};
}

// Проверяет, оказались ли два разделённых кубика рядом — если да,
// они автоматически объединяются обратно в цельный блок (как в оригинале).
function tryJoin(lvl){
  const a = state.split.a, b = state.split.b;
  const xNeighbors = a.r===b.r && Math.abs(a.c-b.c)<=1;
  const yNeighbors = a.c===b.c && Math.abs(a.r-b.r)<=1;
  if(!xNeighbors && !yNeighbors) return false;
  let block;
  if(xNeighbors){
    block = {r1:a.r, c1:Math.min(a.c,b.c), r2:a.r, c2:Math.max(a.c,b.c)};
  } else {
    block = {r1:Math.min(a.r,b.r), c1:a.c, r2:Math.max(a.r,b.r), c2:a.c};
  }
  state.split = null;
  state.block = block;
  return true;
}

function showStatus(kind){
  const isRandom = state.levelIdx === -1;
  const isLast = !isRandom && state.levelIdx === LEVELS.length-1;

  if(kind==='win' && !isRandom && !isLast){
    unlockedUpTo = Math.max(unlockedUpTo, state.levelIdx+1);
    loadLevel(state.levelIdx+1);
    return;
  }

  overlayEl.classList.add('show');
  statusCard.className = 'status-card ' + kind;
  if(kind==='win'){
    if(isRandom){
      statusTitle.textContent = 'Уровень пройден!';
      statusText.textContent = `Готово за ${state.moves} ходов.`;
      statusBtn.textContent = 'Новый случайный уровень →';
      statusBtn.onclick = generateRandomLevel;
    } else {
      statusCard.className = 'status-card win congrats';
      statusTitle.textContent = '🎉 Поздравляем с победой!';
      statusText.textContent = `Ты прошёл все 33 уровня! Последний — за ${state.moves} ходов.`;
      statusBtn.textContent = 'Начать сначала';
      statusBtn.onclick = ()=> loadLevel(0);
    }
  } else {
    statusTitle.textContent = 'Блок упал';
    statusText.textContent = 'Попробуй ещё раз.';
    statusBtn.textContent = 'Заново';
    statusBtn.onclick = ()=> startLevel(currentLevel, state.levelIdx);
  }
}

function handleResult(result){
  spaceBtn.classList.toggle('hidden', !state.split);
  if(result.status==='lost'){
    state.locked = true;
    playSound('fail', 0.5);
    const blockEl = document.getElementById('blockEl');
    const block2El = document.getElementById('block2El');
    setTimeout(()=>{
      blockEl.classList.add('falling');
      if(state.split) block2El.classList.add('falling');
      setTimeout(()=> startLevel(currentLevel, state.levelIdx), 420);
    }, 90);
  } else if(result.status==='won'){
    state.locked = true;
    playSound('win', 0.6);
    setTimeout(()=> showStatus('win'), 140);
  }
}

function moveBlock(dir){
  const lvl = currentLevel;
  const newBlock = rollBlock(state.block, dir);
  state.block = newBlock;
  render(false);
  const result = evaluateBlock(lvl, newBlock);
  refreshBridges();
  render(false);
  handleResult(result);
}

function moveSplit(dir){
  const lvl = currentLevel;
  const dr = dir==='up' ? -1 : dir==='down' ? 1 : 0;
  const dc = dir==='left' ? -1 : dir==='right' ? 1 : 0;
  const cube = state.split.active===0 ? state.split.a : state.split.b;
  const nr = cube.r + dr, nc = cube.c + dc;

  if(isBlocked(lvl, nr, nc)){
    render(false);
    refreshBridges();
    handleResult({status:'lost'});
    return;
  }
  cube.r = nr; cube.c = nc;
  triggerSwitches(lvl, [[nr,nc]], false);

  let result = {status:'playing'};
  if(tryJoin(lvl)){
    result = evaluateBlock(lvl, state.block);
  }
  render(false);
  refreshBridges();
  handleResult(result);
}

function move(dir){
  if(state.locked) return;
  state.moves++;
  moveCountEl.textContent = state.moves;
  playRandomMove();
  if(state.split){
    moveSplit(dir);
  } else {
    moveBlock(dir);
  }
}

function toggleActiveCube(){
  if(!state.split || state.locked) return;
  state.split.active = state.split.active===0 ? 1 : 0;
  render(false);
}

document.addEventListener('keydown', (e)=>{
  const map = {ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',
               w:'up',s:'down',a:'left',d:'right',W:'up',S:'down',A:'left',D:'right'};
  if(map[e.key]){ e.preventDefault(); move(map[e.key]); }
  if(e.key===' '){ e.preventDefault(); toggleActiveCube(); }
  if(e.key==='r' || e.key==='R'){ startLevel(currentLevel, state.levelIdx); }
});

document.querySelectorAll('.dpad button[data-dir]').forEach(btn=>{
  btn.addEventListener('click', ()=> move(btn.dataset.dir));
});
spaceBtn.addEventListener('click', toggleActiveCube);
statusBtn.addEventListener('click', ()=> playSound('click', 0.4));

const infoBtn = document.getElementById('infoBtn');
const infoPopover = document.getElementById('infoPopover');
infoBtn.addEventListener('click', (e)=>{
  e.stopPropagation();
  infoPopover.classList.toggle('show');
  infoBtn.classList.toggle('active');
});
document.addEventListener('click', (e)=>{
  if(!infoPopover.contains(e.target) && e.target!==infoBtn){
    infoPopover.classList.remove('show');
    infoBtn.classList.remove('active');
  }
});

loadLevel(0);

let resizeTimer = null;
window.addEventListener('resize', ()=>{
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(()=>{
    if(currentLevel) render(true);
  }, 120);
});
</script>
</body>
